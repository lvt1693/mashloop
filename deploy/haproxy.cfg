# HAProxy in front of the services on this box. TLS ends here; apps listen on
# loopback only. Certificates: /etc/haproxy/certs/<domain>.pem (fullchain +
# key), written by certbot's deploy hook (deploy/certbot-haproxy.sh).
global
    log /dev/log local0
    log /dev/log local1 notice
    chroot /var/lib/haproxy
    stats socket /run/haproxy/admin.sock mode 660 level admin
    user haproxy
    group haproxy
    daemon
    maxconn 4096
    ssl-default-bind-options ssl-min-ver TLSv1.2 no-tls-tickets
    ssl-default-bind-ciphersuites TLS_AES_128_GCM_SHA256:TLS_AES_256_GCM_SHA384:TLS_CHACHA20_POLY1305_SHA256

defaults
    mode http
    # No request log by default (frontend https_in logs Mash ∞ Loop's). HAProxy's
    # own events (start, reload, a backend going down) still reach the global log.
    no log
    option forwardfor
    timeout connect 5s
    timeout client 120s
    timeout server 300s
    timeout http-request 20s
    timeout http-keep-alive 10s

frontend http_in
    bind :80
    # Let's Encrypt checks the domain over plain HTTP; everything else goes to HTTPS.
    acl acme path_beg /.well-known/acme-challenge/
    use_backend acme if acme
    http-request redirect scheme https code 301 unless acme

frontend https_in
    bind :443 ssl crt /etc/haproxy/certs/ alpn h2,http/1.1
    http-response set-header Strict-Transport-Security "max-age=31536000"
    acl host_mashloop req.hdr(host),field(1,:) -i mashloop.truclv.com
    # Addresses blocked on the admin page, turned away here before the app (the
    # app keeps these files and HAProxy's running lists current: loopbox/guard.py);
    # the trusted ones (the box itself, the owner) never are.
    acl ml_blocked src -f /etc/haproxy/mashloop-block.lst
    acl ml_trusted src -f /etc/haproxy/mashloop-trust.lst
    # Mash ∞ Loop's requests are logged (asked for on 2026-10-24, to catch abuse):
    # /var/log/haproxy.log through rsyslog, rotated daily, 7 days kept. The user
    # agent is taken whole (req.fhdr: req.hdr splits it on its commas);
    # Sec-Fetch-Dest and the Referer without its query (click trackers) show
    # who frames the page and which site's link brought a visitor.
    log global
    option httplog
    http-request capture req.fhdr(User-Agent) len 200
    http-request capture req.hdr(Sec-Fetch-Site) len 12
    http-request capture req.hdr(Sec-Fetch-Dest) len 10
    http-request capture req.fhdr(Referer),field(1,?) len 100
    http-request set-log-level silent unless host_mashloop
    http-request reject if host_mashloop ml_blocked !ml_trusted
    use_backend mashloop if host_mashloop
    default_backend not_found

backend mashloop
    # analysis.json (about 1 MB per song) and the scripts compress well; audio does not.
    compression algo gzip
    compression type application/json text/html text/css application/javascript text/javascript image/svg+xml
    http-request set-header X-Forwarded-Proto https
    server app 127.0.0.1:18765 check inter 5s

backend acme
    server certbot 127.0.0.1:18080

backend not_found
    http-request deny deny_status 404
